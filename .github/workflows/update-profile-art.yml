name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lightweight workflow dependencies
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5

      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render contribution SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed graph
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
